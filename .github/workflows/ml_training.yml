name: ML Training Pipeline

# Treino do XGBoost so sob demanda (spec 005 FR-1). Antes disparava quando a
# mensagem do commit CONTINHA "ML" (inclusive "HTML"/"XML"/"YAML") e fazia
# push direto na main. Agora publica os modelos como artefato: quem quiser
# adota-los baixa o artefato e abre um PR (que passa pelo CI).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de ML
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ml.txt

      - name: Treinar (XGBoost)
        run: python tools/train_xgboost.py

      - name: Publicar modelos como artefato
        uses: actions/upload-artifact@v4
        with:
          name: xgboost-models-${{ github.run_number }}
          path: models/mt5bot_xgboost_*.json
          if-no-files-found: error
