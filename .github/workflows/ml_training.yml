name: ML Training Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "dataset_live_experience_*.csv"
      - "data/dataset_massive*.csv"
      - "tools/train_xgboost.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-commit:
    runs-on: ubuntu-latest
    
    # Executa este job apenas se a mensagem do commit contiver "[ML]" ou for acionado manualmente
    if: contains(github.event.head_commit.message, 'ML') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências ML
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt

      - name: Executar Treinamento Autônomo (XGBoost)
        run: |
          python tools/train_xgboost.py

      - name: Commit e Push dos Modelos JSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Adiciona os arquivos JSON atualizados
          git add mt5bot_xgboost_*.json
          
          # Checa se houve alguma alteração real nos modelos (para evitar commits vazios que dariam erro)
          if git diff --staged --quiet; then
            echo "Nenhuma mudança nos modelos (a performance foi exatamente a mesma)."
          else
            git commit -m "🤖 MLOps: Retreinamento automático da IA [skip ci]"
            git push
          fi
