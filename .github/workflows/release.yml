name: Release

# Tag v* (criada pelo dono) -> CI completo -> instalador + smoke -> GitHub
# Release com o Setup.exe, o guia tecnico e o SHA256SUMS (spec 002 FR-5, AC-3).
# Em PRs que mexem neste arquivo roda como ENSAIO: tudo, menos publicar.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "tools/release_notes.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  installer:
    needs: ci
    uses: ./.github/workflows/package-windows.yml

  publish:
    name: Publish release
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mt5bot-windows-installer
          path: dist

      - name: Version, notes and checksums
        id: meta
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ "$tag" != "v$version" ]]; then
              echo "::error::tag $tag diferente da versao do pyproject.toml ($version)"; exit 1
            fi
          fi
          python3 tools/release_notes.py "$version" > notes.md
          python3 tools/build_manual.py "dist/MT5Bot-Guia-Tecnico-$version.md"
          (cd dist && sha256sum MT5Bot-* > SHA256SUMS && sha256sum -c SHA256SUMS)
          ls -la dist
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/MT5Bot-* dist/SHA256SUMS \
            --title "MT5Bot ${{ steps.meta.outputs.version }}" --notes-file notes.md --verify-tag

      - name: Dry run (sem tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "Ensaio: publicaria MT5Bot ${{ steps.meta.outputs.version }} com:"
          ls dist
          cat dist/SHA256SUMS
          head -20 notes.md
