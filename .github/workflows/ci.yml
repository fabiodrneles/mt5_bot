name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # reutilizado pelo workflow de release

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Instala o projeto pelas dependencias declaradas (spec 001 FR-1). No
      # Windows entra a lib MetaTrader5 real; os testes usam o MT5 simulado.
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest -q

  maestro:
    name: Maestro Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maestro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: maestro/go.mod
          cache-dependency-path: maestro/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race ./...

      - name: Build for Windows
        run: GOOS=windows GOARCH=amd64 go build -o maestro.exe .
