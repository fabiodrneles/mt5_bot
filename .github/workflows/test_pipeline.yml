name: MT5Bot Test Pipeline

on:
  push:
    branches:
      - testes # Executa o pipeline em cada push para a branch 'testes'
  pull_request:
    branches:
      - testes # Executa o pipeline em cada Pull Request para a branch 'testes'

jobs:
  build-and-test:
    runs-on: ubuntu-latest # Executa em um ambiente Linux

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' # Usa a versao 3.10 do Python (ajustar conforme necessario)

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install MetaTrader5 pytz # Instala as dependencias do bot
        pip install -e . # Instala o bot como pacote editavel

    - name: Run tests
      run: python test_strategy.py
      working-directory: . # Garante que os testes rodam no diretorio raiz do projeto

    # Adicionar mais passos aqui, se necessario, como linting, type checking, etc.
