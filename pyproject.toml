[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5bot"
version = "2.12.0"
description = "Bot de trading automatizado para MetaTrader 5 — Enriquecimento de ML Tracking + ML V2 (Elite Quant)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Fabio Dornele"}
]

dependencies = [
    # A lib oficial do MT5 so publica wheels para Windows (spec 002 / D1).
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
    "pandas>=2.0",
    "numpy>=1.24",
    "pytz>=2023.3",
    "xgboost>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "coverage",
]

[project.scripts]
mt5bot = "mt5bot.core.launcher:main"

[tool.setuptools]
packages = ["mt5bot", "mt5bot.core", "mt5bot.engine", "mt5bot.execution", "mt5bot.data", "mt5bot.risk"]

[tool.pytest.ini_options]
# So a suite de verdade: scripts soltos na raiz nao podem derrubar a coleta (spec 001 FR-2).
testpaths = ["tests"]
