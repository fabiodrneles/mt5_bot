[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5bot"
version = "2.0.0"
description = "Bot de trading automatizado para MetaTrader 5 — Enriquecimento de ML Tracking + ML V2 (Elite Quant)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Fabio Dornele"}
]

dependencies = [
    "MetaTrader5>=5.0.45",
    "pandas>=2.0",
    "numpy>=1.24",
    "pytz>=2023.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "coverage",
]

[project.scripts]
mt5bot = "mt5bot.core.launcher:main"

[tool.setuptools]
packages = ["mt5bot", "mt5bot.core", "mt5bot.engine", "mt5bot.execution", "mt5bot.data", "mt5bot.risk"]