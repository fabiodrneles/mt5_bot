[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5bot"
version = "1.8.5"
description = "Bot de trading automatizado para MetaTrader 5 — Setup 9.2 validado completo + cobertura tracker 94% / dashboard 100%"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Fabio Dornele"}
]

dependencies = [
    "MetaTrader5>=5.0.45",
    "pandas>=2.0",
    "numpy>=1.24",
    "pytz>=2023.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "coverage",
]

[project.scripts]
mt5bot = "main:main"

[tool.setuptools]
py-modules = ["main", "config", "indicators", "strategy", "executor", "logger", "persistence", "dashboard", "tracker", "risk_calculator"]