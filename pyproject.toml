[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5bot"
version = "3.0.0"
description = "Bot de trading automatizado para MetaTrader 5 — Enriquecimento de ML Tracking + ML V2 (Elite Quant)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Fabio Dornele"}
]

dependencies = [
    # A lib oficial do MT5 so publica wheels para Windows (spec 002 / D1).
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
    "pandas>=2.0",
    "numpy>=1.24",
    "pytz>=2023.3",
    "xgboost>=1.7.0",
    "psutil>=5.9",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "coverage",
    "ruff>=0.6",
    "build>=1.0",
]

[project.scripts]
mt5bot = "mt5bot.core.launcher:main"

[tool.setuptools.packages.find]
# Descoberta automatica: a lista manual esquecia mt5bot.mentorship (spec 002 FR-1).
include = ["mt5bot*", "interfaces*"]

[tool.pytest.ini_options]
# So a suite de verdade: scripts soltos na raiz nao podem derrubar a coleta (spec 001 FR-2).
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# Erros reais: nomes indefinidos, imports quebrados, codigo morto, sintaxe (spec 001 FR-4).
select = ["E9", "F"]

[tool.coverage.run]
source = ["mt5bot", "interfaces"]

[tool.coverage.report]
# Piso da cobertura (spec 001 FR-7): medida em 61% em 2026-10-24. So sobe.
fail_under = 60
show_missing = false
skip_empty = true
